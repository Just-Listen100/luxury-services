name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run site checks
        run: python3 tests/brand_check.py
